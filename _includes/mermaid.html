<script>
(function() {
  if (window.mermaidInitialized) return;
  window.mermaidInitialized = true;

  // 多个 CDN 依次回退，避免单一 CDN 不可达导致图表全部失效
  var CDN_LIST = [
    'https://fastly.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js',
    'https://unpkg.com/mermaid@10/dist/mermaid.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js',
    'https://cdn.staticfile.org/mermaid/10.9.1/mermaid.min.js',
    'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js'
  ];

  // 把 <pre class="mermaid"> 的内容还原成纯文本。
  // kramdown 会把 --> 转义成 --&gt;，同时 <br /> 会被浏览器解析成真实标签，
  // 导致 textContent 丢失换行、Mermaid 语法被破坏。
  // 这里用 innerHTML 反解实体，并把 <br> 还原成换行符。
  function normalize(el) {
    var html = el.innerHTML;
    html = html.replace(/<br\s*\/?>/gi, '\n');
    html = html.replace(/<\/?p[^>]*>/gi, '\n');
    var ta = document.createElement('textarea');
    ta.innerHTML = html;
    return ta.value.replace(/^\s+|\s+$/g, '');
  }

  function renderAll() {
    var blocks = document.querySelectorAll('.mermaid');
    if (!blocks.length) return;

    // 1. 先规范化所有块的内容（必须在 mermaid.run 之前完成）
    for (var i = 0; i < blocks.length; i++) {
      var el = blocks[i];
      if (el.getAttribute('data-normalized') === '1') continue;
      el.textContent = normalize(el);
      el.setAttribute('data-normalized', '1');
    }

    // 2. 初始化配置
    mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
      themeVariables: {
        background: 'transparent',
        primaryColor: '#ffffff',
        primaryBorderColor: '#333333',
        primaryTextColor: '#333333',
        lineColor: '#333333',
        lineWidth: '2px',
        strokeWidth: '2px',
        secondaryColor: '#ffffff',
        tertiaryColor: '#ffffff',
        fontFamily: 'ui-sans-serif, system-ui, sans-serif',
        fontSize: '14px',
        borderRadius: '4px',
        edgeLabelBackground: '#ffffff'
      },
      flowchart: {
        curve: 'basis',
        padding: 20,
        nodeSpacing: 50,
        rankSpacing: 50
      }
    });

    // 3. 渲染
    mermaid.run({ querySelector: '.mermaid' }).catch(function(err) {
      console.warn('Mermaid 渲染警告:', err);
    });
  }

  function loadFrom(index) {
    if (index >= CDN_LIST.length) {
      console.error('Mermaid: 所有 CDN 均加载失败');
      return;
    }
    var url = CDN_LIST[index];
    var done = false;

    var s = document.createElement('script');
    s.src = url;
    s.async = true;

    function next(reason) {
      if (done) return;
      done = true;
      console.warn('Mermaid CDN 失败(' + reason + ')，尝试下一个:', url);
      loadFrom(index + 1);
    }

    s.onload = function() {
      if (done) return;
      if (typeof window.mermaid === 'undefined') {
        next('onload 但 mermaid 未定义');
        return;
      }
      done = true;
      renderAll();
    };
    s.onerror = function() { next('onerror'); };

    // 关键：某些网络错误不会触发 onerror，用超时兜底
    setTimeout(function() {
      if (!done && typeof window.mermaid === 'undefined') {
        next('超时 8s');
      }
    }, 8000);

    document.head.appendChild(s);
  }

  // 页面没有 mermaid 块就不加载脚本，节省流量
  if (document.querySelector('.mermaid')) {
    loadFrom(0);
  }
})();
</script>
