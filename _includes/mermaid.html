<script>
(function() {
  if (window.mermaidInitialized) return;
  window.mermaidInitialized = true;

  // 加载策略：自托管优先（同域、无跨网延迟），CDN 并行竞速兜底。
  // 自托管文件位于 /assets/js/vendor/mermaid.min.js，由 GitHub Pages 提供并自动 gzip。
  var LOCAL_URL = '{{ "/assets/js/vendor/mermaid.min.js" | relative_url }}';
  var CDN_LIST = [
    'https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js',
    'https://cdn.staticfile.org/mermaid/10.9.1/mermaid.min.js',
    'https://fastly.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js'
  ];

  // 把 <pre class="mermaid"> 的内容还原成纯文本。
  // kramdown 会把 --> 转义成 --&gt;，同时 <br /> 会被浏览器解析成真实标签，
  // 导致 textContent 丢失换行、Mermaid 语法被破坏。
  // 这里用 innerHTML 反解实体，并把 <br> 还原成换行符。
  function normalize(el) {
    var html = el.innerHTML;
    html = html.replace(/<br\s*\/?>/gi, '\n');
    html = html.replace(/<\/?p[^>]*>/gi, '\n');
    var ta = document.createElement('textarea');
    ta.innerHTML = html;
    return ta.value.replace(/^\s+|\s+$/g, '');
  }

  function renderAll() {
    var blocks = document.querySelectorAll('.mermaid');
    if (!blocks.length) return;

    // 1. 先规范化所有块的内容（必须在 mermaid.run 之前完成）
    for (var i = 0; i < blocks.length; i++) {
      var el = blocks[i];
      if (el.getAttribute('data-normalized') === '1') continue;
      el.textContent = normalize(el);
      el.setAttribute('data-normalized', '1');
    }

    // 2. 初始化配置
    mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
      themeVariables: {
        background: 'transparent',
        primaryColor: '#ffffff',
        primaryBorderColor: '#333333',
        primaryTextColor: '#333333',
        lineColor: '#333333',
        lineWidth: '2px',
        strokeWidth: '2px',
        secondaryColor: '#ffffff',
        tertiaryColor: '#ffffff',
        fontFamily: 'ui-sans-serif, system-ui, sans-serif',
        fontSize: '14px',
        borderRadius: '4px',
        edgeLabelBackground: '#ffffff'
      },
      flowchart: {
        curve: 'basis',
        padding: 20,
        nodeSpacing: 50,
        rankSpacing: 50
      }
    });

    // 3. 渲染
    mermaid.run({ querySelector: '.mermaid' }).catch(function(err) {
      console.warn('Mermaid 渲染警告:', err);
    });
  }

  // 并行竞速：同时发起所有请求，谁先成功用谁，其余立即中止。
  // 这样彻底消除了串行回退时"等 8 秒超时"的浪费。
  var settled = false;
  var pending = [];

  function finish() {
    if (settled) return;
    settled = true;
    // 中止其余仍在进行的请求，节省带宽
    for (var i = 0; i < pending.length; i++) {
      try { pending[i].abort(); } catch (e) {}
    }
    pending = [];
    renderAll();
  }

  function tryLoad(url, isLocal) {
    if (settled) return;
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    if (ctrl) pending.push(ctrl);

    fetch(url, ctrl ? { signal: ctrl.signal } : {})
      .then(function(res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      })
      .then(function(code) {
        if (settled) return;
        // 校验内容，避免把 CDN 的 404 页面当成脚本执行
        if (code.length < 10000 || code.indexOf('mermaid') === -1) {
          throw new Error('内容异常');
        }
        var s = document.createElement('script');
        s.textContent = code;
        document.head.appendChild(s);
        if (typeof window.mermaid === 'undefined') throw new Error('执行后 mermaid 未定义');
        finish();
      })
      .catch(function(err) {
        if (settled) return;
        console.warn('Mermaid 来源失败:', url, err && err.message);
        // 自托管失败时，才启动 CDN 竞速
        if (isLocal) {
          for (var i = 0; i < CDN_LIST.length; i++) tryLoad(CDN_LIST[i], false);
        }
      });
  }

  // 页面没有 mermaid 块就不加载脚本，节省流量
  if (document.querySelector('.mermaid')) {
    tryLoad(LOCAL_URL, true);
  }
})();
</script>
