# 幕：目录页与文章页共用的数据（2026-11-06）
#
# 为什么单独放一份：题词与幕名在书里只在扉页出现一次，
# 博客上 17 篇文章分散，若写死在各自的 front matter 里，
# 改一个标点要动 17 个文件。这里存一份，模板按 act 号取。
#
# 归属（依书稿）：序章独立；第一幕 1 章；第二幕 3 章（2—4）；
# 第三幕 2 章（5—6）；第四幕 4 章（7—10）；第五幕 5 章（11—15）；
# 结案陈词 3 篇（16、17、附录）。
#
# id: 6 表示结案陈词——它不是「幕」，但同样带扉页与题词。
# 不用 0：0 在 Ruby Liquid 里是 truthy、在 JS 实现里是 falsy，
# 换成 6 就不依赖任何一方的真假语义。

- id: 1
  label: 第一幕
  title: 可疑的线索——实体论的破绽
  quote: “我思故我在”
  source: 笛卡尔

- id: 2
  label: 第二幕
  title: 新的侦查方向：关系论的浮现
  quote: “此有故彼有”
  source: 《杂阿含经》

- id: 3
  label: 第三幕
  title: 核心证据的浮现：漩涡模型
  quote: “平衡态是死亡，非平衡态才带来有序。”
  source: 普里高津

- id: 4
  label: 第四幕
  title: 真相的扩散——漩涡的普遍性
  quote: “‘我’这一概念，从根本上说、并且归根结底，是一种幻觉。”
  source: 侯世达

- id: 5
  label: 第五幕
  title: 真相背后的真相：漩涡的健康与病理
  quote: “他者的面容”
  source: 列维纳斯

- id: 6
  label: 结案陈词
  title: 漩涡之在，真相的启示
  quote: 存在即漩涡，似烛火摇曳，形常在而质常新
  source: 侦探
